services:
  mysql:
    image: mysql:8.0
    container_name: mysql-deadline
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: pass
    volumes:
      # Монтируем schema.sql — он выполнится при инициализации БД
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      # Ждём, пока MySQL будет готов, чтобы SUT не стартовал раньше времени
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app", "-ppass" ]
      interval: 5s
      timeout: 5s
      retries: 10