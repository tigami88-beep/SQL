image: Ubuntu

services:
  - docker

environment:
  JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64

build_script:
  - chmod +x gradlew
  - ./gradlew clean build -x test
  - mkdir -p artifacts
  - cp build/libs/*.jar artifacts/app-deadline.jar
  - docker compose up -d
  - sleep 10
  - docker ps

test_script:
  - ./gradlew test --info
  - docker logs --tail 50 app || true
  - docker logs --tail 50 app_db || true
  - echo 'Test execution finished. Exit code: $?'

on_finish:
  - docker compose down -v

artifacts:
  - path: build/reports/tests/
    name: test-results