plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'ru.netology'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Selenide (основной фреймворк для автотестов)
    testImplementation 'com.codeborne:selenide:6.12.4'

    // JUnit 5 (для аннотаций @Test, @BeforeAll и т.д.)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'

    // JavaFaker (для генерации тестовых данных)
    implementation 'com.github.javafaker:javafaker:1.0.2'

    // Lombok (чтобы работали @Value и не писать геттеры/сеттеры)
    compileOnly 'org.projectlombok:lombok:1.18.28'
    annotationProcessor 'org.projectlombok:lombok:1.18.28'

    // Apache Commons DBUtils (для SqlHelper и работы с БД)
    implementation 'commons-dbutils:commons-dbutils:1.7'

    // MySQL Driver (если будешь подключаться к MySQL напрямую, а не только через docker-compose)
    runtimeOnly 'mysql:mysql-connector-java:8.0.33'
}

test {
    useJUnitPlatform()
    systemProperty 'selenide.headless', 'true'
    systemProperty 'selenide.timeout', '10000'
}

allure {
    version = '2.25.0'
    autoconfigure = true
}