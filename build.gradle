
plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// ЭТОГО НЕ ХВАТАЛО — репозитории, откуда Gradle скачивает библиотеки
repositories {
    mavenCentral()
}

dependencies {
    // Lombok — для @Value и автогенерации конструкторов/геттеров
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    compileOnly 'org.projectlombok:lombok:1.18.30'

    // Тесты
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Selenide
    testImplementation 'com.codeborne:selenide:6.12.4'

    // Allure
    testImplementation 'io.qameta.allure:allure-junit5:2.24.0'
}

allure {
    autoconfigure = true
    aspectjweaver = true
    version = '2.24.0'
}

test {
    useJUnitPlatform()
    systemProperty 'allure.results.directory', file("$buildDir/allure-results")
}