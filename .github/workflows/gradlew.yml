name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
    # Если нужны параметры БД — задавай здесь
    # DB_URL: "jdbc:mysql://localhost:3307/your_db"
    # DB_USER: "root"
    # DB_PASSWORD: "password"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: "11"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure Selenide headless
        run: |
          echo "selenide.headless=true" >> $GITHUB_ENV
          echo "selenide.browser=chrome" >> $GITHUB_ENV

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/