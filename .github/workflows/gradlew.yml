name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Переменные для тестов (если нужны)
      DB_URL: "jdbc:mysql://localhost:3306/app"
      DB_USER: "root"
      DB_PASSWORD: "password"
      SELENIDE_HEADLESS: "true"
      SELENIDE_BROWSER: "chrome"

    services:
      # Встроенный сервис БД в GitHub Actions (альтернатива docker compose)
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: "11"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build (без тестов — сначала убедимся, что компилируется)
        run: ./gradlew build -x test --no-daemon

      - name: Wait for MySQL service to be ready
        run: |
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -P 3306 -u root -ppassword -e "SELECT 1" > /dev/null 2>&1; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
          if [ $i -eq 30 ]; then
            echo "MySQL did not become ready in time"
            exit 1
          fi

      - name: Run tests
        run: ./gradlew test --info --no-daemon

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Upload JAR artifact (если нужно)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-jar
          path: build/libs/*.jar