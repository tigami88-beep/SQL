name: gradlew

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DB_URL: "jdbc:mysql://localhost:3306/app?allowPublicKeyRetrieval=true&useSSL=false"
      DB_USER: "root"
      DB_PASSWORD: "password"
      SELENIDE_HEADLESS: "true"
      SELENIDE_BROWSER: "chrome"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ВАЖНО: Java 17 вместо 11 — это решает проблему с peer not authenticated
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Install Chrome and chromedriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable chromium-chromedriver

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build (compile only)
        run: ./gradlew build -x test --no-daemon

      - name: Wait for MySQL service to be ready
        run: |
          max_attempts=30
          for i in $(seq 1 $max_attempts); do
            if mysql -h 127.0.0.1 -P 3306 -u root -ppassword -e "SELECT 1" > /dev/null 2>&1; then
              echo "MySQL is ready"
              break
            fi
            echo "Attempt $i/$max_attempts: waiting for MySQL..."
            sleep 2
          done
          if [ $i -eq $max_attempts ]; then
            echo "MySQL did not become ready in time"
            exit 1
          fi

      - name: Run tests
        # --stacktrace даёт понятные ошибки, если тесты упадут
        run: ./gradlew test --stacktrace --no-daemon

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-jar
          path: build/libs/*.jar