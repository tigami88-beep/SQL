name: Java CI with Gradle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Start application
        run: java -jar build/libs/app-mbank.jar &
        # или docker-compose up -d, или другая команда запуска
      - name: Wait for app to be ready
        run: |
          for i in {1..30}; do
            curl -f http://localhost:9999/health && break || sleep 2
          done
      - name: Run tests
        run: ./gradlew test