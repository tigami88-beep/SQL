name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: "11"
          distribution: "temurin"
          cache: gradle  # включает кэширование зависимостей и кэша сборки Gradle

      # Если нужны браузерные тесты — лучше использовать headless Chrome/Firefox
      # и не ставить Edge вручную. Selenide сам скачает драйвер.
      # Можно задать параметры через переменные окружения:
      - name: Configure Selenide headless
        run: |
          echo "selenide.headless=true" >> $GITHUB_ENV
          echo "selenide.browser=chrome" >> $GITHUB_ENV

      - name: Build and test
        # build уже включает compile, test, check и т.д.
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/